<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DS View — Configuração</title>
  <link rel="stylesheet" href="setup.css" />
</head>
<body>
  <main class="card">
    <header class="head">
      <div class="logo">▶</div>
      <div>
        <h1>DS<span>View</span></h1>
        <p class="sub">Cole o link (ou o código) da playlist para esta tela.</p>
      </div>
    </header>

    <label class="field">
      <span>Link ou código da playlist</span>
      <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://seusite.com.br/play/xxxx  ou  12345" />
    </label>

    <label class="field">
      <span>Senha da playlist <em>(deixe em branco se não tiver)</em></span>
      <input id="password" type="password" autocomplete="off" spellcheck="false" placeholder="Senha" />
    </label>
    <p id="err" class="err" hidden></p>

    <div class="actions">
      <button id="go" class="btn primary">Salvar e iniciar</button>
      <button id="fav" class="btn ghost" title="Favoritar esta URL">★ Favoritar</button>
    </div>

    <section class="favs" id="favs-wrap" hidden>
      <h2>Favoritos</h2>
      <ul id="favs"></ul>
    </section>

    <label class="toggle">
      <input id="autostart" type="checkbox" />
      <span>Abrir automaticamente quando o Windows ligar (kiosk desatendido)</span>
    </label>

    <div id="autostart-aviso" class="aviso" hidden>
      <p><b>Falta um passo para a tela voltar sozinha.</b> <span id="autostart-motivo"></span></p>
      <p class="aviso-nota" id="autostart-como"></p>
    </div>
    <p id="autostart-ok" class="aviso-ok" hidden></p>

    <label class="toggle">
      <input id="offline" type="checkbox" checked />
      <span>Modo offline (baixa e toca do cache local). Desligado, consome só o servidor online.</span>
    </label>

    <div class="row" id="offline-opts">
      <label class="field inline">
        <span>Checar a playlist a cada</span>
        <select id="interval">
          <option value="5">5 minutos</option>
          <option value="10">10 minutos</option>
          <option value="15">15 minutos</option>
          <option value="30">30 minutos</option>
          <option value="60" selected>1 hora (padrão)</option>
          <option value="120">2 horas</option>
          <option value="360">6 horas</option>
          <option value="720">12 horas</option>
          <option value="1440">24 horas</option>
        </select>
      </label>
      <button id="clear" class="btn ghost" title="Apagar tudo que está salvo offline e baixar de novo">🗑 Limpar dados offline</button>
    </div>

    <div class="quit-row">
      <button id="quit" class="btn danger" title="Encerra o DS View (fecha o programa)">⏻ Encerrar o aplicativo</button>
    </div>

    <footer class="foot">
      Botão direito na tela do player reabre este menu. Sair do kiosk: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Q</kbd>.
    </footer>
  </main>

  <!-- Preloader (1º acesso / troca de playlist: baixa tudo antes de iniciar) -->
  <div id="loader" class="loader" hidden>
    <div class="loader-box">
      <div class="spinner"></div>
      <h2 id="loader-title">Baixando o conteúdo…</h2>
      <p id="loader-sub">Preparando para tocar offline.</p>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
    </div>
  </div>

  <script src="setup.js"></script>
</body>
</html>
